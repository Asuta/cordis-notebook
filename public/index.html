<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留白 · 插件笔记本</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="host-bar"><a href="/" class="host-brand">留白 <span>PLUGIN NOTEBOOK</span></a><div><span id="connection">连接中…</span><button id="manage-plugins">◈ 插件管理</button></div></div><div id="app"></div><div id="app-placeholder" hidden>布局插件未启用。你可以随时通过右上角「插件管理」恢复界面。</div>
<dialog id="plugin-manager"><div class="manager-header"><div><div class="eyebrow">MAKE IT YOUR OWN</div><h2>插件工作台</h2><p id="plugin-summary"></p></div><button id="close-manager" aria-label="关闭插件管理">✕</button></div><div class="trust-notice">完全信任模式 · 第三方插件可访问本机文件、网络并执行命令。独立进程用于生命周期管理，不是安全沙箱。</div><div class="install-box"><label class="install-label">＋ 安装本地插件包<input type="file" id="plugin-file" accept=".json"></label><span>选择 .cordis-plugin.json · 最大 2 MB · 安装后手动启用</span><div id="install-preview" hidden><p id="install-description"></p><label><input type="checkbox" id="trust-plugin"> 我信任该插件，并允许其使用当前账户权限运行前后端代码。</label><button id="install-plugin" disabled>确认安装</button></div></div><div id="plugin-list"></div><footer class="manager-footer">管理内核始终可用 · 停用不撤销已执行的文件修改或命令 · 卸载保留插件数据</footer></dialog><div id="toast" role="alert" hidden></div><script type="module" src="/runtime.js"></script></body></html>
