<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>插件应用</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="host-bar"><span id="current-application"></span><div><button id="manage-applications">切换应用</button><span id="connection">连接中…</span><button id="manage-plugins">◈ 插件管理</button></div></div><div id="app"></div><div id="app-placeholder" hidden>当前没有插件挂载应用界面。你可以随时通过右上角「插件管理」恢复界面。</div>
<dialog id="application-picker" aria-labelledby="application-title"><div class="manager-header"><div><h2 id="application-title">选择应用</h2><p>每次打开一套插件，各自保存配置和数据。</p></div><button id="close-applications" aria-label="关闭应用选择">✕</button></div><p id="application-error" role="alert"></p><div id="application-list"></div><footer class="manager-footer"><button id="stop-application">关闭当前应用</button></footer></dialog><dialog id="plugin-manager"><div class="manager-header"><div><div class="eyebrow">MAKE IT YOUR OWN</div><h2>插件工作台</h2><p id="plugin-summary"></p></div><button id="close-manager" aria-label="关闭插件管理">✕</button></div><div id="plugin-list"></div><footer class="manager-footer">管理内核始终可用 · 停用保留插件数据</footer></dialog><div id="toast" role="alert" hidden></div><script type="module" src="/runtime.js"></script></body></html>
